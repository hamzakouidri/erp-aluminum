name: database_data
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # 🟢 الحزم الخاصة بقاعدة البيانات (تم إضافة دعم الكمبيوتر ffi)
  sqflite_sqlcipher: ^3.4.0
  # sqflite_common_ffi: ^2.3.3

  audioplayers: ^6.7.0
  path: ^1.9.1
  intl: ^0.20.2
  dropdown_button2: ^3.1.0
  image_picker: ^1.1.2
  # Retained temporarily for lockfile stability; Gemini calls are now routed
  # through the server gateway instead of this client SDK.
  google_generative_ai: ^0.4.7
  path_provider: ^2.1.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0

  # حزم فايربيس (Firebase)
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.0.1
  cloud_firestore: ^6.4.1
  supabase_flutter: ^2.0.0

  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.2
  share_plus: ^12.0.2
  archive: ^3.6.1
  record: ^6.2.1
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  http: any
  pdf: ^3.12.0
  bidi: ^2.0.13
  printing: ^5.14.3
  flutter_file_dialog: ^3.0.3
  sqflite_common_ffi: ^2.4.0+3
  sqflite_common_ffi_web: ^0.4.0
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_svg: ^2.0.10+1
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^18.0.1

dependency_overrides:
  # SQLCipher 3.4.x options are incompatible with the new concrete-options
  # cast used when sqflite_common 2.5.8 recovers a native transaction.
  sqflite_common: 2.5.7
  mgrs_dart: 2.0.0
  speech_to_text_windows:
    path: tool/windows_plugin_stubs/speech_to_text_windows
  url_launcher_windows:
    path: tool/windows_plugin_stubs/url_launcher_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/Amiri-Bold.ttf
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
    - assets/fonts/Arial-Regular.ttf
    - assets/sections/
    # SQLite runtime used by the persistent web database. Keeping it as a
    # Flutter asset guarantees that Firebase Hosting receives it on every
    # web build.
    - web/sqlite3.wasm
    - Icon/
    - assets/Icon/
    - web/favicon.png

  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial-Regular.ttf
    # Arabic uses the Cairo family. Older screens that explicitly request it
    # therefore remain consistent with the global Arabic theme.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
