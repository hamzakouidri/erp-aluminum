<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <!-- Realistic metallic gradients for Zamak/Aluminium cast -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a9299"/>
      <stop offset="15%" stop-color="#b8c0c7"/>
      <stop offset="50%" stop-color="#e2e8ec"/>
      <stop offset="85%" stop-color="#9aa2a9"/>
      <stop offset="100%" stop-color="#6f777e"/>
    </linearGradient>
    <linearGradient id="metalEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ced5db"/>
      <stop offset="100%" stop-color="#555c63"/>
    </linearGradient>
    <radialGradient id="holeGradient" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4a5056"/>
      <stop offset="60%" stop-color="#2c3034"/>
      <stop offset="100%" stop-color="#181a1c"/>
    </radialGradient>
    <radialGradient id="screwBevel" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4dbe0"/>
      <stop offset="80%" stop-color="#7e868d"/>
      <stop offset="100%" stop-color="#4b5157"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Main Chamfered Body of Taquet / Tasso -->
    <!-- Top bevel cut (35, 45) -> (65, 20) -> (135, 20) -> (165, 45) -->
    <path d="M 68 25 
             L 132 25 
             L 155 55 
             L 155 175 
             C 170 185, 170 215, 155 225 
             L 155 345 
             L 132 375 
             L 68 375 
             L 45 345 
             L 45 225 
             C 30 215, 30 185, 45 175 
             L 45 55 
             Z" 
          fill="url(#metalBody)" 
          stroke="#4b5258" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Left Lateral Ridge / Sliding Channel Guides -->
    <path d="M 45 55 L 72 70 L 72 330 L 45 345 Z" 
          fill="#949ca3" 
          opacity="0.75" 
          stroke="#4b5258" 
          stroke-width="1.5"/>

    <path d="M 155 55 L 128 70 L 128 330 L 155 345 Z" 
          fill="#838b92" 
          opacity="0.7" 
          stroke="#4b5258" 
          stroke-width="1.5"/>

    <!-- Central Rib / Raised Spine -->
    <path d="M 85 40 
             L 115 40 
             L 115 160 
             L 85 160 Z" 
          fill="url(#metalEdge)" 
          stroke="#555c63" 
          stroke-width="1"/>

    <path d="M 85 240 
             L 115 240 
             L 115 360 
             L 85 360 Z" 
          fill="url(#metalEdge)" 
          stroke="#555c63" 
          stroke-width="1"/>

    <!-- Central Boss / Circular Expansion for Screw -->
    <circle cx="100" cy="200" r="32" fill="url(#screwBevel)" stroke="#3e4348" stroke-width="2"/>
    <circle cx="100" cy="200" r="23" fill="url(#metalBody)" stroke="#4e555b" stroke-width="1.5"/>
    
    <!-- Countersunk Screw Hole (Trou fraisé) -->
    <circle cx="100" cy="200" r="14" fill="url(#holeGradient)" stroke="#1a1c1e" stroke-width="2"/>
    <circle cx="100" cy="200" r="6" fill="#111315"/>

    <!-- Highlights & Metallic Accents -->
    <line x1="98" y1="35" x2="98" y2="155" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="98" y1="245" x2="98" y2="365" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="72" y1="75" x2="72" y2="325" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
