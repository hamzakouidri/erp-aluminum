<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Zamak Metallic Gradients -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E6E9"/>
      <stop offset="35%" stop-color="#B8C0C6"/>
      <stop offset="70%" stop-color="#8C969F"/>
      <stop offset="100%" stop-color="#67737C"/>
    </linearGradient>
    <linearGradient id="metalShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#CCD3D8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4F5962" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pocketDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#414950"/>
      <stop offset="40%" stop-color="#69737C"/>
      <stop offset="100%" stop-color="#9BA5AE"/>
    </linearGradient>
    <radialGradient id="screwHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2327"/>
      <stop offset="60%" stop-color="#343B41"/>
      <stop offset="85%" stop-color="#555E67"/>
      <stop offset="100%" stop-color="#A5AFB8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main Block Base -->
  <g filter="url(#shadow)">
    <!-- Outer Zamak Profile with Wings -->
    <path d="M 35 55 
             L 65 55 
             L 65 40 
             Q 65 35 70 35 
             L 130 35 
             Q 135 35 135 40 
             L 135 55 
             L 165 55 
             Q 172 55 172 62 
             L 172 145 
             Q 172 152 165 152 
             L 135 152 
             L 135 165 
             Q 135 170 130 170 
             L 70 170 
             Q 65 170 65 165 
             L 65 152 
             L 35 152 
             Q 28 152 28 145 
             L 28 62 
             Q 28 55 35 55 Z" 
          fill="url(#metalBody)" 
          stroke="#4B535A" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Left Wing Stepped Ridge -->
    <path d="M 33 60 L 60 60 L 60 147 L 33 147 Z" fill="#9BA5AE" opacity="0.6"/>
    <path d="M 38 65 L 55 65 L 55 142 L 38 142 Z" fill="#69737C" opacity="0.4"/>
    
    <!-- Right Wing Stepped Ridge -->
    <path d="M 140 60 L 167 60 L 167 147 L 140 147 Z" fill="#9BA5AE" opacity="0.6"/>
    <path d="M 145 65 L 162 65 L 162 142 L 145 142 Z" fill="#69737C" opacity="0.4"/>

    <!-- Central Raised Core Bevel -->
    <rect x="68" y="45" width="64" height="115" rx="4" fill="url(#metalShine)" stroke="#3E454B" stroke-width="1.8"/>

    <!-- Central Top and Bottom Recessed Pockets -->
    <rect x="74" y="52" width="52" height="26" rx="2" fill="url(#pocketDepth)" stroke="#2D3338" stroke-width="1.2"/>
    <rect x="74" y="127" width="52" height="26" rx="2" fill="url(#pocketDepth)" stroke="#2D3338" stroke-width="1.2"/>

    <!-- Central Rib / Locator Slot -->
    <rect x="97" y="52" width="6" height="26" fill="#202428"/>
    <rect x="97" y="127" width="6" height="26" fill="#202428"/>

    <!-- Center Countersunk Screw Hole -->
    <circle cx="100" cy="102" r="16" fill="url(#screwHole)" stroke="#3A4147" stroke-width="2"/>
    <circle cx="100" cy="102" r="9" fill="#15181A" stroke="#252A2E" stroke-width="1.5"/>

    <!-- Inner Thread Details -->
    <path d="M 94 99 Q 100 97 106 100" stroke="#485158" stroke-width="1" fill="none"/>
    <path d="M 94 104 Q 100 102 106 105" stroke="#485158" stroke-width="1" fill="none"/>

    <!-- Highlight Edge Rim -->
    <path d="M 70 47 L 130 47" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 70 47 L 70 158" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>
  </g>
</svg>
